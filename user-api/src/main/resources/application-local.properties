spring.datasource.url=jdbc:h2:file:./data/userscore;MODE=MySQL;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
# Development only. Other profiles require JWT_SECRET.
api.security.token.secret=${JWT_SECRET:local-development-only-change-before-deployment}
