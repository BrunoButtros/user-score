spring.application.name=user-api
spring.profiles.default=local
server.port=${SERVER_PORT:8080}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
viacep.url=${VIACEP_URL:https://viacep.com.br/ws/}
score.api.url=${SCORE_API_URL:http://localhost:8081/score}
api.security.token.secret=${JWT_SECRET}
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:1025}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_STARTTLS:false}
app.file.path=${APP_FILE_PATH:./data/usuarios_scores.txt}
feature.envia.email=${ENVIAR_EMAIL:false}
reports.schedule=${REPORTS_SCHEDULE:500000}
management.endpoints.web.exposure.include=health
management.health.mail.enabled=${ENVIAR_EMAIL:false}
