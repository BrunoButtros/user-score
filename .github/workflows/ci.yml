name: CI
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: userscore
          MYSQL_USER: userscore
          MYSQL_PASSWORD: ci-only-password
          MYSQL_ROOT_PASSWORD: ci-only-root-password
        ports: ["3306:3306"]
        options: --health-cmd="mysqladmin ping -h localhost --silent" --health-interval=5s --health-timeout=5s --health-retries=30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - run: mvn -B -ntp verify
      - run: node scripts/smoke.mjs
      - run: node scripts/smoke.mjs --mysql
        env:
          SMOKE_MYSQL_URL: jdbc:mysql://127.0.0.1:3306/userscore?allowPublicKeyRetrieval=true&useSSL=false
          MYSQL_USERNAME: userscore
          MYSQL_PASSWORD: ci-only-password
          JWT_SECRET: ci-only-jwt-secret-never-use-in-production
